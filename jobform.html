<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a Job | Ticia in Tech</title>
    <meta name="description" content="Submit a job request or project inquiry to Ticia in Tech.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        :root {
            --magenta: #E91E8C;
            --yellow: #FFE500;
            --purple: #9B4DCA;
            --dark-bg: #0a0a0f;
            --dark-surface: #12121a;
            --dark-card: #1a1a25;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --gradient-brand: linear-gradient(135deg, var(--magenta) 0%, var(--purple) 50%, var(--yellow) 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .bg-gradient {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(233, 30, 140, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(155, 77, 202, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 229, 0, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { height: 80px; transition: transform 0.3s ease; }
        .logo:hover { transform: scale(1.05); }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.3s ease;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px; left: 0;
            width: 0; height: 2px;
            background: var(--gradient-brand);
            transition: width 0.3s ease;
        }

        .nav-links a:hover { color: var(--text-primary); }
        .nav-links a:hover::after { width: 100%; }

        .mobile-menu {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 5px;
        }

        .mobile-menu span {
            width: 25px; height: 2px;
            background: var(--text-primary);
            transition: 0.3s;
        }

        .form-container {
            max-width: 700px;
            width: 100%;
            margin: 9rem auto 4rem;
            padding: 3rem;
            background: var(--dark-surface);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 1;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .form-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .form-header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: var(--gradient-brand);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .form-header p {
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.3rem;
            font-size: 0.95rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.9rem 1rem;
            margin-bottom: 0.5rem;
            border-radius: 10px;
            background: var(--dark-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--magenta);
            outline: none;
            box-shadow: 0 0 10px rgba(233, 30, 140, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .btn {
            padding: 1rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary {
            background: var(--gradient-brand);
            color: var(--dark-bg);
            width: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(233, 30, 140, 0.3);
        }

        .btn-secondary-action {
            background: transparent;
            color: var(--text-primary);
            border: 2px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            text-align: center;
        }

        .btn-secondary-action:hover {
            border-color: var(--magenta);
            background: rgba(233, 30, 140, 0.1);
        }

        footer {
            text-align: center;
            padding: 2rem;
            background: var(--dark-surface);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 1;
        }

        footer p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
                position: absolute;
                top: 100%; left: 0; right: 0;
                background: rgba(10, 10, 15, 0.98);
                flex-direction: column;
                padding: 2rem;
                gap: 1.5rem;
                text-align: center;
            }
            .nav-links.active { display: flex; }
            .mobile-menu { display: flex; }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>

    <nav>
        <div class="nav-container">
            <a href="index.html"><img src="images/logo-white.png" alt="Ticia in Tech" class="logo"></a>
            <ul class="nav-links">
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#services">Services</a></li>
                <li><a href="index.html#portfolio">Portfolio</a></li>
                <li><a href="index.html#contact">Contact</a></li>
                <li><a href="volunteer.html">Volunteer</a></li>
            </ul>
            <div class="mobile-menu" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <div class="form-container">
        <div class="form-header">
            <h1>Submit a Job</h1>
            <p>Provide your details and upload relevant files below.</p>
        </div>

        <form action="https://formspree.io/f/xgogznyq" method="POST" enctype="multipart/form-data">
            <input type="hidden" name="_redirect" value="https://ticiaintech.com">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" required>
            </div>

            <div class="form-group">
                <label>Due Date</label>
                <input type="date" name="due_date" required>
            </div>

            <div class="form-group">
                <label>Is this a repeat job?</label>
                <select name="repeat_job" required>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>

            <div class="form-group">
                <label>Previous Job Reference</label>
                <input type="text" name="previous_reference">
            </div>

            <div class="form-group">
                <label>Upload Files</label>
                <a href="https://ticiantech-my.sharepoint.com/:f:/g/personal/leticia_ticiaintech_com/IgDDMQ2UzSsqQrgviDmpdCTcAYCCcH0FpSnHKvMEbdvxGMU" class="btn btn-secondary-action" target="_blank" rel="noopener">Upload Files</a>
            </div>

            <div class="form-group">
                <label>Additional Information</label>
                <textarea name="additional_info" rows="5"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Submit Job</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2025 Ticia in Tech. Innovation Made Simple.</p>
    </footer>

    <script>
        function toggleMenu() {
            document.querySelector('.nav-links').classList.toggle('active');
        }

        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                document.querySelector('.nav-links').classList.remove('active');
            });
        });
    </script>
</body>
</html>
