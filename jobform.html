<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a Job | Ticia in Tech</title>
    <meta name="description" content="Submit a job request or project inquiry to Ticia in Tech.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        :root {
            --magenta: #E91E8C;
            --yellow: #FFE500;
            --purple: #9B4DCA;
            --dark-bg: #0a0a0f;
            --dark-surface: #12121a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --gradient-brand: linear-gradient(135deg, var(--magenta) 0%, var(--purple) 50%, var(--yellow) 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .bg-gradient {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(233, 30, 140, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(155, 77, 202, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 229, 0, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { height: 80px; transition: transform 0.3s ease; }
        .logo:hover { transform: scale(1.05); }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .nav-links a:hover { color: var(--text-primary); }

        .form-container {
            max-width: 750px;
            width: 100%;
            margin: 9rem auto 4rem;
            padding: 2.5rem;
            background: var(--dark-surface);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 1;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .form-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: var(--gradient-brand);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .form-header p {
            color: var(--text-secondary);
        }

        .iframe-container {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #ffffff;
            margin-bottom: 2rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .iframe-container iframe {
            width: 100%;
            /* Increased height to fit all questions and branching fields comfortably */
            height: 1150px; 
            border: none;
            display: block;
        }

        .upload-section {
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .upload-section label {
            display: block;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.75rem;
        }

        .btn-secondary-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.9rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            background: transparent;
            color: var(--text-primary);
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-secondary-action:hover {
            border-color: var(--magenta);
            background: rgba(233, 30, 140, 0.1);
        }

        footer {
            text-align: center;
            padding: 2rem;
            background: var(--dark-surface);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 1;
        }

        footer p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .nav-links { display: none; }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>

    <nav>
        <div class="nav-container">
            <a href="index.html"><img src="images/logo-white.png" alt="Ticia in Tech" class="logo"></a>
            <ul class="nav-links">
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#services">Services</a></li>
                <li><a href="index.html#portfolio">Portfolio</a></li>
                <li><a href="index.html#contact">Contact</a></li>
                <li><a href="volunteer.html">Volunteer</a></li>
            </ul>
        </div>
    </nav>

    <div class="form-container">
        <div class="form-header">
            <h1>Submit a Job</h1>
            <p>Fill out your request details and upload project files below.</p>
        </div>
<!-- Embedded Microsoft Form -->
        <div class="iframe-container">
            <iframe src="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=M_FTaXgp9U6vGqvBdnVp90KhPDeY4YpArvSmpG2wwe9UODNFS1hXRFVER0ZTQlFPVzkwMVQ3Mk83Ni4u&embed=true" title="Job Submission Form"></iframe>
        </div>
        <!-- Separate OneDrive File Upload Section -->
        <div class="upload-section">
            <label>Have project files to share?</label>
            <a href="https://ticiantech-my.sharepoint.com/:f:/g/personal/leticia_ticiaintech_com/IgDDMQ2UzSsqQrgviDmpdCTcAYCCcH0FpSnHKvMEbdvxGMU" class="btn-secondary-action" target="_blank" rel="noopener">Upload Files via OneDrive</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Ticia in Tech. Innovation Made Simple.</p>
    </footer>
</body>
</html>
